<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imgui</title>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body, html { width:100%; height:100%; background:#4B0082; overflow:hidden }

#particles-js {
	position:absolute;
	top:0; left:0;
	width:100%; height:100%;
}

/* top bar */
.bar {
	position:fixed;
	top:16px;
	left:50%;
	transform:translateX(-50%);
	display:flex;
	gap:10px;
	z-index:100;
}
.btn {
	width:48px;
	height:48px;
	background:rgba(255,255,255,.08);
	border:1px solid rgba(255,255,255,.2);
	border-radius:12px;
	backdrop-filter:blur(10px);
	display:flex;
	align-items:center;
	justify-content:center;
	cursor:pointer;
	color:rgba(255,255,255,.85);
	transition:background .2s, transform .2s, border-color .2s;
	user-select:none;
}
.btn:hover {
	background:rgba(255,255,255,.18);
	border-color:rgba(255,255,255,.45);
	transform:translateY(-2px);
}
.btn svg {
	width:20px; height:20px;
	stroke:currentColor;
	fill:none;
	stroke-width:2;
	stroke-linecap:round;
	stroke-linejoin:round;
}

/* settings overlay */
#soverlay {
	display:none;
	position:fixed;
	inset:0;
	z-index:999;
	background:rgba(10,0,20,.6);
	backdrop-filter:blur(18px);
	-webkit-backdrop-filter:blur(18px);
	align-items:center;
	justify-content:center;
}
#soverlay.show { display:flex; animation:pop .2s ease }

@keyframes pop {
	from { opacity:0; transform:scale(.97) }
	to { opacity:1; transform:scale(1) }
}

.spanel {
	background:rgba(30,0,60,.8);
	border:1px solid rgba(180,100,255,.25);
	border-radius:20px;
	padding:48px 52px;
	width:420px;
	max-width:92vw;
	text-align:center;
	position:relative;
	box-shadow:0 0 60px rgba(130,0,255,.25);
}
.sclose {
	position:absolute;
	top:14px; right:16px;
	background:none;
	border:none;
	color:rgba(255,255,255,.35);
	font-size:22px;
	cursor:pointer;
	line-height:1;
	transition:color .2s;
}
.sclose:hover { color:#fff }
.stitle {
	font:700 22px/1 'Segoe UI',sans-serif;
	color:#fff;
	letter-spacing:.5px;
	margin-bottom:6px;
}
.ssub {
	font:13px 'Segoe UI',sans-serif;
	color:rgba(200,160,255,.65);
	margin-bottom:32px;
}
.slinks { display:flex; flex-direction:column; gap:12px }
.slink {
	display:flex;
	align-items:center;
	justify-content:space-between;
	background:rgba(255,255,255,.05);
	border:1px solid rgba(255,255,255,.1);
	border-radius:12px;
	padding:14px 18px;
	color:rgba(255,255,255,.85);
	font:500 14px 'Segoe UI',sans-serif;
	cursor:pointer;
	transition:background .2s, border-color .2s, transform .15s;
}
.slink:hover {
	background:rgba(160,80,255,.18);
	border-color:rgba(160,80,255,.45);
	transform:translateX(3px);
}
.slink-inner { display:flex; align-items:center; gap:10px }
.slink-inner svg {
	width:16px; height:16px;
	stroke:currentColor; fill:none;
	stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
	flex-shrink:0;
}
.sarrow { opacity:.4; font-size:16px }

/* game grid */
#games {
	position:fixed;
	top:50%;
	left:50%;
	transform:translate(-50%,-50%);
	z-index:50;
	padding:20px 30px;
	display:flex;
	flex-wrap:wrap;
	gap:18px;
	justify-content:center;
	max-height:80vh;
	max-width:90vw;
	overflow-y:auto;
}
.gcard {
	display:flex;
	flex-direction:column;
	align-items:center;
	gap:8px;
	cursor:pointer;
	transition:transform .15s;
}
.gcard:hover { transform:translateY(-4px) }
.gcard img {
	width:100px; height:100px;
	border-radius:16px;
	object-fit:cover;
	border:2px solid rgba(255,255,255,.1);
	box-shadow:0 4px 20px rgba(0,0,0,.5);
}
.gname {
	font-family:'Comic Sans MS','Chalkboard SE',cursive;
	font-size:10px;
	font-weight:700;
	letter-spacing:.8px;
	text-transform:uppercase;
	color:rgba(255,255,255,.85);
	text-align:center;
	max-width:100px;
}

/* full page game view */
#gview {
	display:none;
	position:fixed;
	inset:0;
	z-index:998;
	flex-direction:column;
}
#gview.show { display:flex }
#gview iframe {
	width:100%; flex:1;
	border:none;
	background:#000;
}
#gbar {
	background:#1a1a1a;
	display:flex;
	align-items:center;
	justify-content:space-between;
	padding:0 14px;
	height:42px;
	flex-shrink:0;
}
#gbar-l { display:flex; align-items:center; gap:10px }
#gbar-r { display:flex; align-items:center; gap:10px }
#ghome, .gctrl {
	background:none;
	border:none;
	color:rgba(255,255,255,.55);
	cursor:pointer;
	padding:4px;
	transition:color .2s;
	display:flex;
}
#ghome:hover, .gctrl:hover { color:#fff }
#ghome svg, .gctrl svg {
	width:16px; height:16px;
	stroke:currentColor; fill:none;
	stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
}
#gtitle {
	font:600 12px/1 'Segoe UI',sans-serif;
	letter-spacing:1px;
	text-transform:uppercase;
	color:rgba(255,255,255,.7);
}
</style>
</head>
<body>

<div class="bar">
	<span class="btn" onclick="document.getElementById('soverlay').classList.add('show')">
		<svg viewBox="0 0 24 24">
			<circle cx="12" cy="12" r="3"/>
			<path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
		</svg>
	</span>
	<span class="btn" onclick="openGame('https://guns.lol/macsen','guns.lol/macsen')" style="font:600 11px/1 monospace;letter-spacing:.3px">guns.lol</span>
	<span class="btn"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
	<span class="btn"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
	<span class="btn"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span>
</div>

<div id="soverlay" onclick="if(event.target===this)this.classList.remove('show')">
	<div class="spanel">
		<button class="sclose" onclick="document.getElementById('soverlay').classList.remove('show')">✕</button>
		<div class="stitle">Settings</div>
		<div class="ssub">Customize your experience</div>
		<div class="slinks">
			<div class="slink"><span class="slink-inner"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M3 12h1m16 0h1M12 3v1m0 16v1m-6.36-15.36.71.71m11.31 11.31.71.71M5.64 18.36l.71-.71m11.31-11.31.71-.71"/></svg> Theme</span><span class="sarrow">›</span></div>
			<div class="slink"><span class="slink-inner"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg> Sound</span><span class="sarrow">›</span></div>
			<div class="slink"><span class="slink-inner"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg> Particles</span><span class="sarrow">›</span></div>
			<div class="slink"><span class="slink-inner"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> Links</span><span class="sarrow">›</span></div>
			<div class="slink"><span class="slink-inner"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg> About</span><span class="sarrow">›</span></div>
		</div>
	</div>
</div>

<div id="games">
	<div class="gcard" onclick="openGame('https://cdn.jsdelivr.net/gh/genizy/web-port@7aaf14f96983e501a2757aca01c4a500505b2646/deltarune/index.html','DELTARUNE')">
		<div style="width:100px;height:100px;border-radius:16px;border:2px solid rgba(255,255,255,.1);box-shadow:0 4px 20px rgba(0,0,0,.5);background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden">
			<img src="https://cdn.jsdelivr.net/gh/genizy/web-port@7aaf14f96983e501a2757aca01c4a500505b2646/deltarune/logo.png" style="width:80%;height:80%;object-fit:contain" alt="deltarune">
		</div>
		<span class="gname">Deltarune</span>
	</div>
</div>

<div id="gview">
	<iframe id="gframe" src="" allowfullscreen></iframe>
	<div id="gbar">
		<div id="gbar-l">
			<button id="ghome" onclick="closeGame()">
				<svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
			</button>
			<span id="gtitle"></span>
		</div>
		<div id="gbar-r">
			<button class="gctrl" onclick="var f=document.getElementById('gframe');f.src=f.src">
				<svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
			</button>
			<button class="gctrl" onclick="document.getElementById('gview').requestFullscreen()">
				<svg viewBox="0 0 24 24"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
			</button>
		</div>
	</div>
</div>

<div id="particles-js"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
<script>
function openGame(url, name) {
	document.getElementById('gframe').src = url
	document.getElementById('gtitle').textContent = name.toUpperCase()
	document.getElementById('gview').classList.add('show')
	window.location.hash = name.toLowerCase().replace(/\s/g,'-')
}

function closeGame() {
	document.getElementById('gview').classList.remove('show')
	document.getElementById('gframe').src = ''
	history.pushState('', '', window.location.pathname)
}

window.addEventListener('popstate', () => {
	if (!window.location.hash) closeGame()
})

particlesJS('particles-js', {
	particles: {
		number: { value:120, density:{ enable:true, value_area:800 } },
		color: { value:['#cc99ff','#ffffff','#9933ff','#e0b3ff'] },
		shape: { type:'circle' },
		opacity: { value:.7, random:true, anim:{ enable:true, speed:1, opacity_min:.2, sync:false } },
		size: { value:3, random:true, anim:{ enable:true, speed:2, size_min:.5, sync:false } },
		line_linked: { enable:true, distance:130, color:'#9933ff', opacity:.3, width:1 },
		move: { enable:true, speed:2, direction:'none', random:true, straight:false, out_mode:'out', bounce:false }
	},
	interactivity: {
		detect_on: 'canvas',
		events: { onhover:{ enable:true, mode:'repulse' }, onclick:{ enable:true, mode:'push' }, resize:true },
		modes: { repulse:{ distance:100, duration:.4 }, push:{ particles_nb:4 } }
	},
	retina_detect: true
})
</script>
</body>
</html>
