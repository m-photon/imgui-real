<!DOCTYPE html>
<html lang="en-us">

<head>
    <base href="https://cdn.jsdelivr.net/gh/genizy/web-port@master/ultrakill/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | ULTRAKILL</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
            width: 100%;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: fixed;
            top: 0;
            left: 0;
        }

        #saved {
            position: fixed;
            bottom: 12px;
            right: 12px;
            color: #fff;
            font-family: cursive;
            font-size: 13px;
            background: rgba(0,0,0,0.7);
            padding: 5px 10px;
            border-radius: 5px;
            display: none;
            z-index: 9999;
            pointer-events: none;
        }

        #savebtn {
            position: fixed;
            bottom: 12px;
            left: 12px;
            color: #fff;
            font-family: cursive;
            font-size: 13px;
            background: rgba(0,0,0,0.7);
            border: 1px solid #fff;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            z-index: 9999;
            display: none;
        }
    </style>
</head>

<body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <div id='loading-text' style="color: black; font-family: cursive; font-size: 48px; text-align: center; margin-top: 20px;">LOADING...</div>
    <canvas id="unity-canvas" tabindex="-1" hidden></canvas>
    <div id="saved">saved</div>
    <button id="savebtn" onclick="dosave()">save</button>

    <script src="Build/ultrakill.loader.js"></script>
    <script>
        var canvas = document.querySelector("#unity-canvas");
        var ready = false;

        function showsaved() {
            var el = document.getElementById("saved");
            el.style.display = "block";
            clearTimeout(el.t);
            el.t = setTimeout(function() { el.style.display = "none"; }, 2000);
        }

        function dosave() {
            if (typeof FS == "undefined") return;
            FS.syncfs(false, function(err) {
                if (err) { console.log("save failed", err); return; }
                showsaved();
            });
        }

        setInterval(function() { if (ready) dosave(); }, 60000);

        document.addEventListener("visibilitychange", function() {
            if (document.hidden && ready) dosave();
        });

        window.addEventListener("beforeunload", function() {
            if (ready) dosave();
        });

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            var meta = document.createElement('meta');
            meta.name = 'viewport';
            meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
            document.getElementsByTagName('head')[0].appendChild(meta);
            canvas.style.width = "100%";
            canvas.style.height = "100%";
            canvas.style.position = "fixed";
            document.body.style.textAlign = "left";
        } else {
            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                canvas.style.width = window.innerWidth + "px";
                canvas.style.height = window.innerHeight + "px";
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);
        }

        function mergeFiles(fileParts) {
            return new Promise((resolve, reject) => {
                let buffers = [];
                function fetchPart(index) {
                    if (index >= fileParts.length) {
                        resolve(URL.createObjectURL(new Blob(buffers)));
                        return;
                    }
                    fetch(fileParts[index]).then(r => r.arrayBuffer()).then(data => {
                        buffers.push(data);
                        fetchPart(index + 1);
                    }).catch(reject);
                }
                fetchPart(0);
            });
        }

        function getParts(file, start, end) {
            let parts = [];
            for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
            return parts;
        }

        Promise.all([
            mergeFiles(getParts("Build/ultrakill.data.unityweb", 1, 4)),
            mergeFiles(getParts("Build/ultrakill.wasm.unityweb", 1, 2))
        ]).then(([dataUrl, wasmurl]) => {
            document.querySelector("#unity-canvas").hidden = false;
            createUnityInstance(document.querySelector("#unity-canvas"), {
                dataUrl: dataUrl,
                frameworkUrl: "Build/ultrakill.framework.js.unityweb",
                codeUrl: wasmurl,
                streamingAssetsUrl: "StreamingAssets",
                companyName: "Hakita and Cake Logic",
                productName: "ULTRAKILL",
                productVersion: "1.4",
            }).then(() => {
                document.querySelector("#loading-text").remove();
                document.getElementById("savebtn").style.display = "block";
                ready = true;
            });
        });
    </script>
</body>

</html>
