<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>imgui</title>
    <style>
        * { margin: 0; padding: 3; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; background: #000; overflow: hidden; transition: background 0.3s ease; }
        #particles-js { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        #main-logo-container { position: fixed; top: 14px; left: 14px; width: 64px; height: 64px; z-index: 105; cursor: pointer; border-radius: 50%; border: 2px solid rgba(160, 80, 255, 0.45); box-shadow: 0 0 14px rgba(160, 80, 255, 0.35); transition: transform 0.2s, box-shadow 0.2s; overflow: hidden; background-color: transparent; display: flex; align-items: center; justify-content: center; }
        #main-logo-container:hover { transform: scale(1.05); box-shadow: 0 0 20px rgba(160, 80, 255, 0.55); }
        #main-logo-container img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.12); }
        .bar { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); display: flex; justify-content: center; gap: 32px; z-index: 100; background: rgba(15, 15, 15, 0.85); padding: 10px 40px; min-width: 360px; border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .btn { width: 48px; height: 48px; background: transparent; border: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: rgba(255, 255, 255, 0.85); transition: background 0.2s, transform 0.2s; user-select: none; position: relative; z-index: 101; }
        .btn:hover { background: rgba(255, 255, 255, 0.1); transform: translateY(-2px); }
        .btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .overlay { display: none; position: fixed; inset: 0; z-index: 999; background: rgba(10, 0, 20, 0.6); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); align-items: center; justify-content: center; }
        .overlay.show { display: flex; animation: pop 0.2s ease; }
        @keyframes pop { from { opacity: 0; transform: scale(0.97); } to { opacity: 1; transform: scale(1); } }
        .settings-box { background: rgba(30, 0, 60, 0.8); border: 1px solid rgba(180, 100, 255, 0.25); border-radius: 20px; padding: 48px 52px; width: 420px; max-width: 92vw; text-align: center; position: relative; box-shadow: 0 0 60px rgba(130, 0, 255, 0.25); }
        .close-btn { position: absolute; top: 14px; right: 16px; background: none; border: none; color: rgba(255, 255, 255, 0.35); font-size: 22px; cursor: pointer; line-height: 1; transition: color 0.2s; }
        .close-btn:hover { color: #fff; }
        .panel-title { font: 700 22px/1 'Segoe UI', sans-serif; color: #fff; letter-spacing: 0.5px; margin-bottom: 6px; }
        .panel-sub { font: 13px 'Segoe UI', sans-serif; color: rgba(200, 160, 255, 0.65); margin-bottom: 32px; }
        #games-grid { position: fixed; top: 55%; left: 50%; transform: translate(-50%, -50%); z-index: 50; padding: 30px; display: grid; grid-template-columns: repeat(3, 100px); gap: 32px 40px; justify-content: center; max-height: 75vh; width: 480px; overflow-y: auto; overflow-x: hidden; background: rgba(60, 60, 60, 0.25); border-radius: 24px; border: 1px solid rgba(255, 255, 255, 0.15); backdrop-filter: blur(4px); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); }
        .game-card { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; transition: transform 0.15s; position: relative; z-index: 51; }
        .game-card:hover { transform: translateY(-4px); }
        .game-icon { width: 100px; height: 100px; border-radius: 16px; border: 2px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5); background-color: #000; background-position: center; background-repeat: no-repeat; background-size: 70%; }
        .game-icon.cover { background-size: cover; }
        .game-title { font-family: 'Comic Sans MS', sans-serif; font-size: 10px; font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.85); text-align: center; max-width: 100px; }
        #game-player { display: none; position: fixed; inset: 0; z-index: 998; flex-direction: column; }
        #game-player.show { display: flex; }
        #game-player iframe { width: 100%; flex: 1; border: none; background: #000; }
        #player-bar { background: #1a1a1a; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; height: 42px; flex-shrink: 0; }
        #player-left, #player-right { display: flex; align-items: center; gap: 10px; }
        .ctrl-btn { background: none; border: none; color: rgba(255, 255, 255, 0.55); cursor: pointer; padding: 4px; display: flex; }
        .ctrl-btn:hover { color: #fff; }
        .ctrl-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; }
        #current-game-name { font: 600 12px 'Segoe UI', sans-serif; text-transform: uppercase; color: rgba(255, 255, 255, 0.7); }
    </style>
</head>
<body>

<div id="particles-js"></div>

<div id="main-logo-container" style="display: none;" onclick="nukeGame()">
    <img src="https://media.discordapp.net/attachments/1463304807149473946/1501364151019376720/Screenshot_2026-05-02_193140.png?width=249&height=237" alt="IMGUI Logo">
</div>

<div class="bar" style="display: none;">
    <span class="btn" onclick="location.reload()" title="Logout">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </span>
</div>

<div id="login-overlay" class="overlay show">
    <div class="settings-box">
        <div class="panel-title">Authentication</div>
        <div id="auth-status" class="panel-sub">Login or register to continue</div>
        
        <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 20px;">
            <input type="text" id="auth-username" placeholder="Username" style="width: 100%; padding: 14px 18px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; outline: none;">
            <input type="password" id="auth-password" placeholder="Password" style="width: 100%; padding: 14px 18px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; outline: none;">
            
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="loginUser()" style="flex: 1; padding: 14px; background: rgba(160, 80, 255, 0.45); border: 1px solid rgba(160, 80, 255, 0.8); border-radius: 12px; color: white; font-weight: bold; cursor: pointer;">Login</button>
                <button onclick="registerUser()" style="flex: 1; padding: 14px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; color: white; font-weight: bold; cursor: pointer;">Register</button>
            </div>
        </div>
    </div>
</div>

<div id="games-grid" style="display: none;">
    <div class="game-card" onclick="loadDisThing('games/deltarune.html', 'DELTARUNE')">
        <div class="game-icon" style="background-image: url('https://cdn.jsdelivr.net/gh/technonyte00/deltarune@main/logo.png');"></div>
        <span class="game-title">Deltarune</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/baldi.html', 'BALDIS BASICS PLUS')">
        <div class="game-icon" style="background-image: url('https://cdn.jsdelivr.net/gh/genizy/web-port@latest/baldi-plus/TemplateData/favicon.ico');"></div>
        <span class="game-title">Baldi's Basics Plus</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/utyellow.html', 'UNDERTALE YELLOW')">
        <div class="game-icon" style="background-image: url('https://cdn.jsdelivr.net/gh/genizy/web-port@main/undertale-yellow/favicon.png');"></div>
        <span class="game-title">Undertale Yellow</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/slope.html', 'SLOPE')">
        <div class="game-icon cover" style="background-image: url('https://slopeio.org/data/image/options/slopeio-banner.jpg');"></div>
        <span class="game-title">Slope</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/retrobowl.html', 'RETRO BOWL')">
        <div class="game-icon cover" style="background-image: url('https://tse2.mm.bing.net/th/id/OIP.rjS4TxunapYU3ao85kSa9gHaD4?r=0&rs=1&pid=ImgDetMain&o=7&rm=3');"></div>
        <span class="game-title">Retro Bowl</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/gobble.html', 'GOBBLE')">
        <div class="game-icon cover" style="background-image: url('https://cdn.jsdelivr.net/gh/genizy/fancade@main/gobble/webapp/cover.jpg');"></div>
        <span class="game-title">Gobble</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/hardestgame.html', 'WORLDS HARDEST GAME')">
        <div class="game-icon cover" style="background-image: url('https://tse3.mm.bing.net/th/id/OIP.jt-JIRVjML9A_aLx5PO-UAHaEJ?r=0&cb=thfc1falcon&rs=1&pid=ImgDetMain&o=7&rm=3');"></div>
        <span class="game-title">World's Hardest Game</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/sansfight.html', 'BAD TIME SIMULATOR')">
        <div class="game-icon cover" style="background-image: url('https://tse2.mm.bing.net/th/id/OIP.5tR11T_i4_Pc50PzDD1v7gAAAA?r=0&cb=thfc1falcon&rs=1&pid=ImgDetMain&o=7&rm=3');"></div>
        <span class="game-title">Sans Fight</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/geodash.html', 'GEOMETRY DASH')">
        <div class="game-icon cover" style="background-image: url('https://www.dologame.com/games/images/20230425/geometry_dash.jpg');"></div>
        <span class="game-title">Geometry Dash</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/ragdollhit.html', 'RAGDOLL HIT')">
        <div class="game-icon cover" style="background-image: url('https://tse3.mm.bing.net/th/id/OIP.V1bvMxTr_yNWr1_KR4EuAAHaD3?r=0&cb=thfc1falcon&w=1408&h=736&rs=1&pid=ImgDetMain&o=7&rm=3');"></div>
        <span class="game-title">Ragdoll Hit</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/ragdollarchers.html', 'RAGDOLL ARCHERS')">
        <div class="game-icon cover" style="background-image: url('https://geodashlite.io/data/image/game/ragdoll-archers.jpg');"></div>
        <span class="game-title">Ragdoll Archers</span>
    </div>

    <div class="game-card" onclick="loadDisThing('games/peopleplayground.html', 'PEOPLE PLAYGROUND')">
        <div class="game-icon cover" style="background-image: url('https://tse2.mm.bing.net/th/id/OIP.U3BFNh2bFQniD1_ykAp0hQHaFF?r=0&cb=thfc1falcon&rs=1&pid=ImgDetMain&o=7&rm=3');"></div>
        <span class="game-title">People Playground</span>
    </div>
</div>

<div id="game-player">
    <iframe id="iframe-canvas" src="" allow="autoplay; fullscreen" allowfullscreen sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups"></iframe>
    <div id="player-bar">
        <div id="player-left">
            <button class="ctrl-btn" onclick="nukeGame()"><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button>
            <span id="current-game-name"></span>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
<script>
    if (localStorage.getItem('imgui_device_block') === 'true') {
        document.getElementById('auth-status').textContent = "DEVICE BANNED PERMANENTLY";
        document.getElementById('auth-status').style.color = "red";
        document.querySelectorAll('button').forEach(b => b.disabled = true);
    }

    function playClickNoise() {
        try {
            const context = new (window.AudioContext || window.webkitAudioContext)();
            const osc = context.createOscillator();
            const gain = context.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, context.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, context.currentTime + 0.08);
            gain.gain.setValueAtTime(0.15, context.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, context.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(context.destination);
            osc.start();
            osc.stop(context.currentTime + 0.08);
        } catch(e) {}
    }

    document.addEventListener('click', (e) => {
        if (e.target.closest('button, .game-card, .btn')) {
            playClickNoise();
        }
    });

    function loadDisThing(url, name) {
        let theFrame = document.getElementById('iframe-canvas');
        document.getElementById('current-game-name').textContent = name;
        theFrame.src = url + "?v=" + Date.now();
        document.getElementById('game-player').classList.add('show');
    }

    function nukeGame() {
        document.getElementById('iframe-canvas').src = '';
        document.getElementById('game-player').classList.remove('show');
    }

    async function loginUser() {
        if (localStorage.getItem('imgui_device_block') === 'true') return;
        const username = document.getElementById('auth-username').value;
        const password = document.getElementById('auth-password').value;

        const response = await fetch('https://imgui-backend.onrender.com/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        
        if (response.status === 403) {
            localStorage.setItem('imgui_device_block', 'true');
            alert("ACCESS DENIED: Your device is now permanently banned.");
            location.reload();
            return;
        }

        if (response.ok) {
            document.getElementById('login-overlay').classList.remove('show');
            document.getElementById('main-logo-container').style.display = 'flex';
            document.querySelector('.bar').style.display = 'flex';
            document.getElementById('games-grid').style.display = 'grid';
        } else {
            alert(data.message);
        }
    }

    async function registerUser() {
        if (localStorage.getItem('imgui_device_block') === 'true') return;
        const username = document.getElementById('auth-username').value;
        const password = document.getElementById('auth-password').value;

        const response = await fetch('https://imgui-backend.onrender.com/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        alert(data.message);
    }

    try {
        particlesJS("particles-js", {
            particles: {
                number: { value: 50 },
                color: { value: "#ffffff" },
                shape: { type: "circle" },
                opacity: { value: 0.3 },
                size: { value: 2 },
                line_linked: { enable: true, distance: 120, color: "#a050ff", opacity: 0.15, width: 1 },
                move: { enable: true, speed: 1 }
            }
        });
    } catch(e){}
</script>
</body>
</html>
