<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <title>imgui</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #4B0082;
            overflow: hidden;
            transition: background 0.3s ease;
        }

        #particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .bar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn {
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.85);
            transition: background 0.2s, transform 0.2s, border-color 0.2s;
            user-select: none;
            position: relative;
            z-index: 101;
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(10, 0, 20, 0.6);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            align-items: center;
            justify-content: center;
        }

        .overlay.show {
            display: flex;
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .spanel {
            background: rgba(30, 0, 60, 0.8);
            border: 1px solid rgba(180, 100, 255, 0.25);
            border-radius: 20px;
            padding: 48px 52px;
            width: 420px;
            max-width: 92vw;
            text-align: center;
            position: relative;
            box-shadow: 0 0 60px rgba(130, 0, 255, 0.25);
        }

        .sclose {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.35);
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

        .sclose:hover {
            color: #fff;
        }

        .stitle {
            font: 700 22px/1 'Segoe UI', sans-serif;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .ssub {
            font: 13px 'Segoe UI', sans-serif;
            color: rgba(200, 160, 255, 0.65);
            margin-bottom: 32px;
        }

        .slinks {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slink {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 18px;
            color: rgba(255, 255, 255, 0.85);
            font: 500 14px 'Segoe UI', sans-serif;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
            position: relative;
        }

        .slink:hover {
            background: rgba(160, 80, 255, 0.18);
            border-color: rgba(160, 80, 255, 0.45);
            transform: translateX(3px);
        }

        .slink-inner {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slink-inner svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .sarrow {
            opacity: 0.4;
            font-size: 16px;
        }

        .about-content {
            color: rgba(255, 255, 255, 0.85);
            font: 14px/1.6 'Segoe UI', sans-serif;
            text-align: left;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            min-height: 150px;
        }

        #games {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
            max-height: 80vh;
            max-width: 90vw;
            overflow-y: auto;
        }
