<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>imgui</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            background: #4B0082;
            overflow: hidden;
        }

        #particles-js {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .bar {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .btn {
            width: 48px;
            height: 48px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.85);
            transition: background 0.2s, transform 0.2s, border-color 0.2s;
            user-select: none;
        }

        .btn:hover {
            background: rgba(0, 0, 0, 0.85);
            border-color: rgba(255, 255, 255, 0.35);
            transform: translateY(-2px);
        }

        .btn svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #soverlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 999;
            background: rgba(10, 0, 20, 0.6);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            align-items: center;
            justify-content: center;
        }

        #soverlay.show {
            display: flex;
            animation: pop 0.2s ease;
        }

        @keyframes pop {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        .spanel {
            background: rgba(30, 0, 60, 0.8);
            border: 1px solid rgba(180, 100, 255, 0.25);
            border-radius: 20px;
            padding: 48px 52px;
            width: 420px;
            max-width: 92vw;
            text-align: center;
            position: relative;
            box-shadow: 0 0 60px rgba(130, 0, 255, 0.25);
        }

        .sclose {
            position: absolute;
            top: 14px;
            right: 16px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.35);
            font-size: 22px;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

        .sclose:hover {
            color: #fff;
        }

        .stitle {
            font: 700 22px/1 'Segoe UI', sans-serif;
            color: #fff;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .ssub {
            font: 13px 'Segoe UI', sans-serif;
            color: rgba(200, 160, 255, 0.65);
            margin-bottom: 32px;
        }

        .slinks {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .slink {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 14px 18px;
            color: rgba(255, 255, 255, 0.85);
            font: 500 14px 'Segoe UI', sans-serif;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.15s;
        }

        .slink:hover {
            background: rgba(160, 80, 255, 0.18);
            border-color: rgba(160, 80, 255, 0.45);
            transform: translateX(3px);
        }

        .slink-inner {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .slink-inner svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex-shrink: 0;
        }

        .sarrow {
            opacity: 0.4;
            font-size: 16px;
        }

        #games {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 50;
            padding: 20px 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            justify-content: center;
            max-height: 80vh;
            max-width: 90vw;
            overflow-y: auto;
        }

        .gcard {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.15s;
        }

        .gcard:hover {
            transform: translateY(-4px);
        }

        .gicon {
            width: 100px;
            height: 100px;
            border-radius: 16px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            background-color: #000;
            background-position: center;
            background-repeat: no-repeat;
            background-size: 70%;
        }

        .gicon.cover {
            background-size: cover;
        }

        .gname {
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            max-width: 100px;
        }

        #gview {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 998;
            flex-direction: column;
        }

        #gview.show {
            display: flex;
        }

        #gview iframe {
            width: 100%;
            flex: 1;
            border: none;
            background: #000;
        }

        #gbar {
            background: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            height: 42px;
            flex-shrink: 0;
        }

        #gbar-l, #gbar-r {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #ghome, .gctrl {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
            display: flex;
        }

        #ghome:hover, .gctrl:hover {
            color: #fff;
        }

        #ghome svg, .gctrl svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #gtitle {
            font: 600 12px/1 'Segoe UI', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>

        pwrmessage: `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>pwRMessage</title><link rel="icon" href="https://cdn.teampwr.dev/pwrmessage/favicon.ico"><link rel="stylesheet" href="https://cdn.teampwr.dev/pwrmessage/imgui/tailwind.css"><script src="https://cdn.teampwr.dev/pwrmessage/socket.io.min.js"><\/script></head><body class="bg-brand-bg text-white"><div id="toast-container"></div><div id="auth-view" class="flex items-center justify-center h-screen"><div class="bg-brand-panel p-8 rounded-3xl border border-brand accent-glow w-full max-w-sm backdrop-blur-imgui"><h1 class="text-2xl font-bold mb-6 tracking-tighter text-center">pwRMessage</h1><input id="auth-user" type="text" placeholder="Username" class="w-full bg-brand-glass p-4 rounded-xl mb-3 outline-none border border-brand focus:ring-2 focus:ring-brand-accent text-white placeholder-brand-text-sub"><input id="auth-pass" type="password" placeholder="Password" class="w-full bg-brand-glass p-4 rounded-xl mb-6 outline-none border border-brand focus:ring-2 focus:ring-brand-accent text-white placeholder-brand-text-sub"><div class="flex gap-2"><button onclick="handleAuth('login')" class="flex-grow bg-brand-accent text-white p-4 rounded-xl font-bold hover:opacity-80 transition-imgui shadow-[0_0_15px_rgba(160,80,255,0.4)]">Login</button><button onclick="handleAuth('register')" class="flex-grow border-2 border-brand p-4 rounded-xl font-bold hover:bg-brand-glass transition-imgui">Sign Up</button></div></div></div><div id="app-view" class="hidden h-screen flex relative"><div id="customModal" class="modal-overlay"><div class="modal-card"><h2 id="modalTitle" class="text-xl font-bold mb-2"></h2><p id="modalDesc" class="text-brand-sub mb-6 text-sm"></p><input id="modalInput" type="text" class="w-full bg-brand-glass p-4 rounded-xl outline-none border border-brand focus:ring-2 focus:ring-brand-accent mb-6 text-white"><div class="flex gap         deltarune: `<!DOCTYPE html><html><head>
<base href="https://cdn.jsdelivr.net/gh/genizy/web-port@7aaf14f96983e501a2757aca01c4a500505b2646/deltarune/">
<meta charset="UTF-8"><link rel="stylesheet" href="style.css"></head><body>
<div class="logo-container"><img src="logo.png" alt="Logo" class="logo"></div>
<div class="menu">
<a href="javascript:loadChapter(1)" class="row"><span class="chapter">Chapter 1</span><span class="title">The Beginning</span><img src="icons/1.png"></a>
<a href="javascript:loadChapter(2)" class="row"><span class="chapter">Chapter 2</span><span class="title">A Cyber's World</span><img src="icons/2.png"></a>
<a href="javascript:alert('Chapter 3 not included in demo!')" class="disabled-row"><span class="chapter">Chapter 3</span><span class="title">--</span><img src="icons/0.png"></a>
<a href="javascript:alert('Chapter 4 not included in demo!')" class="disabled-row"><span class="chapter">Chapter 4</span><span class="title">--</span><img src="icons/0.png"></a>
<a href="javascript:alert('Chapter 5 coming soon!')" class="disabled-row"><span class="chapter">Chapter 5</span><span class="disabled-title">--</span><img src="icons/0.png"></a>
<a href="javascript:alert('Chapter 6 coming soon!')" class="disabled-row"><span class="chapter">Chapter 6</span><span class="disabled-title">--</span><img src="icons/0.png"></a>
<a href="javascript:alert('Chapter 7 coming soon!')" class="disabled-row"><span class="chapter">Chapter 7</span><span class="disabled-title">--</span><img src="icons/0.png"></a>
</div>
<audio id="drone" loop autoplay hidden><source src="audios/AUDIO_DRONE.ogg" type="audio/ogg"></audio>
<button id="mute">🔊</button>
<script>
var audio=document.getElementById('drone'),mute=document.getElementById('mute'),started=false;
mute.onclick=function(){if(!started){audio.muted=!audio.muted;mute.textContent=audio.muted?'🔊':'🔇'}};
function loadChapter(c){
  fetch('chapter'+c+'/index.html').then(r=>r.text()).then(html=>{
    started=true;document.documentElement.innerHTML=html;
    document.querySelectorAll('script').forEach(s=>{var n=document.createElement('script');if(s.src)n.src=s.src;else n.textContent=s.textContent;document.body.appendChild(n)});
  });
}
var mm=new Audio('audios/snd_menumove.mp3'),ms=new Audio('audios/snd_select.mp3');
document.querySelectorAll('.row').forEach(r=>{r.onmouseenter=()=>{if(!started)mm.play()};r.onclick=()=>{if(!started)ms.play()}});
var sel=null;
document.onkeydown=function(e){
  if(started)return;
  var rows=document.querySelectorAll('.row');
  if(e.key==='ArrowUp'){sel=sel===null?0:(sel-1+rows.length)%rows.length;rows.forEach(r=>r.classList.remove('selected'));rows[sel].classList.add('selected');mm.play();}
  else if(e.key==='ArrowDown'){sel=sel===null?0:(sel+1)%rows.length;rows.forEach(r=>r.classList.remove('selected'));rows[sel].classList.add('selected');mm.play();}
  else if(e.key==='Enter'&&sel!==null){window.location.href=rows[sel].href;ms.play();}
}
<\/script></body></html>`,
