<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>imgui</title>
<style>
* { margin:0; padding:0; box-sizing:border-box }
body, html { width:100%; height:100%; background:#4B0082; overflow:hidden }

#particles-js {
	position:absolute;
	top:0; left:0;
	width:100%; height:100%;
}

/* top bar */
.bar {
	position:fixed;
	top:16px;
	left:50%;
	transform:translateX(-50%);
	display:flex;
	gap:10px;
	z-index:100;
}
.btn {
	width:48px;
	height:48px;
	background:rgba(0,0,0,.6);
	border:1px solid rgba(255,255,255,.15);
	border-radius:12px;
	backdrop-filter:blur(10px);
	display:flex;
	align-items:center;
	justify-content:center;
	cursor:pointer;
	color:rgba(255,255,255,.85);
	transition:background .2s, transform .2s, border-color .2s;
	user-select:none;
}
.btn:hover {
	background:rgba(0,0,0,.85);
	border-color:rgba(255,255,255,.35);
	transform:translateY(-2px);
}
.btn svg {
	width:20px; height:20px;
	stroke:currentColor;
	fill:none;
	stroke-width:2;
	stroke-linecap:round;
	stroke-linejoin:round;
}

/* settings overlay */
#soverlay {
	display:none;
	position:fixed;
	inset:0;
	z-index:999;
	background:rgba(10,0,20,.6);
	backdrop-filter:blur(18px);
	-webkit-backdrop-filter:blur(18px);
	align-items:center;
	justify-content:center;
}
#soverlay.show { display:flex; animation:pop .2s ease }

@keyframes pop {
	from { opacity:0; transform:scale(.97) }
	to { opacity:1; transform:scale(1) }
}

.spanel {
	background:rgba(30,0,60,.8);
	border:1px solid rgba(180,100,255,.25);
	border-radius:20px;
	padding:48px 52px;
	width:420px;
	max-width:92vw;
	text-align:center;
	position:relative;
	box-shadow:0 0 60px rgba(130,0,255,.25);
}
.sclose {
	position:absolute;
	top:14px; right:16px;
	background:none;
	border:none;
	color:rgba(255,255,255,.35);
	font-size:22px;
	cursor:pointer;
	line-height:1;
	transition:color .2s;
}
.sclose:hover { color:#fff }
.stitle {
	font:700 22px/1 'Segoe UI',sans-serif;
	color:#fff;
	letter-spacing:.5px;
	margin-bottom:6px;
}
.ssub {
	font:13px 'Segoe UI',sans-serif;
	color:rgba(200,160,255,.65);
	margin-bottom:32px;
}
.slinks { display:flex; flex-direction:column; gap:12px }
.slink {
	display:flex;
	align-items:center;
	justify-content:space-between;
	background:rgba(255,255,255,.05);
	border:1px solid rgba(255,255,255,.1);
	border-radius:12px;
	padding:14px 18px;
	color:rgba(255,255,255,.85);
	font:500 14px 'Segoe UI',sans-serif;
	cursor:pointer;
	transition:background .2s, border-color .2s, transform .15s;
}
.slink:hover {
	background:rgba(160,80,255,.18);
	border-color:rgba(160,80,255,.45);
	transform:translateX(3px);
}
.slink-inner { display:flex; align-items:center; gap:10px }
.slink-inner svg {
	width:16px; height:16px;
	stroke:currentColor; fill:none;
	stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
	flex-shrink:0;
}
.sarrow { opacity:.4; font-size:16px }

/* game grid */
#games {
	position:fixed;
	top:50%;
	left:50%;
	transform:translate(-50%,-50%);
	z-index:50;
	padding:20px 30px;
	display:flex;
	flex-wrap:wrap;
	gap:18px;
	justify-content:center;
	max-height:80vh;
	max-width:90vw;
	overflow-y:auto;
}
.gcard {
	display:flex;
	flex-direction:column;
	align-items:center;
	gap:8px;
	cursor:pointer;
	transition:transform .15s;
}
.gcard:hover { transform:translateY(-4px) }
.gcard img {
	width:100px; height:100px;
	border-radius:16px;
	object-fit:contain;
	object-position:center;
	border:2px solid rgba(255,255,255,.1);
	box-shadow:0 4px 20px rgba(0,0,0,.5);
	background:#000;
}
.gname {
	font-family:'Comic Sans MS','Chalkboard SE',cursive;
	font-size:10px;
	font-weight:700;
	letter-spacing:.8px;
	text-transform:uppercase;
	color:rgba(255,255,255,.85);
	text-align:center;
	max-width:100px;
}

/* full page game view */
#gview {
	display:none;
	position:fixed;
	inset:0;
	z-index:998;
	flex-direction:column;
}
#gview.show { display:flex }
#gview iframe {
	width:100%; flex:1;
	border:none;
	background:#000;
}
#gbar {
	background:#1a1a1a;
	display:flex;
	align-items:center;
	justify-content:space-between;
	padding:0 14px;
	height:42px;
	flex-shrink:0;
}
#gbar-l { display:flex; align-items:center; gap:10px }
#gbar-r { display:flex; align-items:center; gap:10px }
#ghome, .gctrl {
	background:none;
	border:none;
	color:rgba(255,255,255,.55);
	cursor:pointer;
	padding:4px;
	transition:color .2s;
	display:flex;
}
#ghome:hover, .gctrl:hover { color:#fff }
#ghome svg, .gctrl svg {
	width:16px; height:16px;
	stroke:currentColor; fill:none;
	stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
}
#gtitle {
	font:600 12px/1 'Segoe UI',sans-serif;
	letter-spacing:1px;
	text-transform:uppercase;
	color:rgba(255,255,255,.7);
}
</style>
</head>

<script>

function loadChapter(c){
  fetch('chapter'+c+'/index.html').then(r=>r.text()).then(html=>{

    document.querySelectorAll('script').forEach(s=>{var n=document.createElement('script');if(s.src)n.src=s.src;else n.textContent=s.textContent;document.body.appendChild(n)});

function openGame(id, name) {
	var f = document.getElementById('gframe')
	if (games[id]) f.srcdoc = games[id]
	else f.src = id
	document.getElementById('gtitle').textContent = name.toUpperCase()
	document.getElementById('gview').classList.add('show')
	window.location.hash = id
}

function closeGame() {
	var f = document.getElementById('gframe')
	f.srcdoc = ''; f.src = ''
	document.getElementById('gview').classList.remove('show')
	history.pushState('', '', window.location.pathname)
}

window.addEventListener('popstate', () => {
	if (!window.location.hash) closeGame()
})

	},
	retina_detect: true
})
</script>
