<!DOCTYPE html><html><head><meta charset="UTF-8"><style>*{margin:0;padding:0}body{background:#000;overflow:hidden}</style></head><body><script>
const BASE = 'https://cdn.jsdelivr.net/gh/bubbls/UGS-Assets@main/fnf0.7.5/';
fetch(BASE + 'index.html')
  .then(r => r.text())
  .then(html => {
    html = html.replace(/<base[^>]*>/gi, '');
    html = html.replace(/src="\.?\//g, 'src="' + BASE);
    html = html.replace(/href="\.?\//g, 'href="' + BASE);
    html = html.replace(/url\('\.?\//g, "url('" + BASE);
    html = html.replace('<head>', '<head><base href="' + BASE + '">');
    document.open(); document.write(html); document.close();
  });
</script></body></html>
