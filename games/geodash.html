<!DOCTYPE html><html><head><base href="https://cdn.jsdelivr.net/gh/genizy/google-class@main/gdlite/"><meta charset="UTF-8"><style>*{margin:0;padding:0}body{background:#000;overflow:hidden}</style></head><body><script>
fetch('https://cdn.jsdelivr.net/gh/genizy/google-class@main/gdlite/index.html')
  .then(r=>r.text())
  .then(html=>{
    const base = document.querySelector('base');
    document.open();document.write(html);document.close();
    if(!document.querySelector('base')){
      const b=document.createElement('base');
      b.href='https://cdn.jsdelivr.net/gh/genizy/google-class@main/gdlite/';
      document.head.prepend(b);
    }
  });
</script></body></html>
