<!DOCTYPE html>
<html>
<head>
    <title>Loading pwRMessage...</title>
</head>
<body>
    <script>
        (async () => {
            try {
                const response = await fetch('https://cdn.teampwr.dev/pwrmessage/imgui');
                if (!response.ok) throw new Error('teampwR CDN replied with a response that was not 200 OK<br>Try refreshing.');
                
                const newContent = await response.text();
                
                document.open();
                document.write(newContent);
                document.close();
            } catch (err) {
                document.body.innerHTML = "An error occurred:<br><br>" + err.message;
            }
        })();
    </script>
</body>
</html>
