<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ragdoll Archers</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #231f20;
        }
        #unity-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        #loading-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #231f20;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99;
        }
        .spinner {
            border: 5px solid rgba(255, 255, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #55ff55;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div id="unity-container">
    <canvas id="unity-canvas"></canvas>
</div>

<div id="loading-cover">
    <div class="spinner"></div>
</div>

<script>
    // Direct alternate enterprise data server that passes MIME constraints
    const cleanDataHost = "https://ubg44.github.io/ragdoll-archers/Build";

    const config = {
      dataUrl: cleanDataHost + "/6697b6deba8b617c67b69c55dcd07cb1.data.unityweb",
      frameworkUrl: cleanDataHost + "/0be3c3ee7115b26e1ae28e643afdf1f2.js.unityweb",
      codeUrl: cleanDataHost + "/b3397c29f6878557c1c614cbf9e196ea.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Ericetto",
      productName: "Ragdoll Archers",
      productVersion: "0.1",
    };

    const container = document.querySelector("#unity-container");
    const canvas = document.querySelector("#unity-canvas");
    const loadingCover = document.querySelector("#loading-cover");

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // TRUE FIX: Pulling the script loader as standard data to bypass strict browser MIME filters entirely
    fetch(cleanDataHost + "/v111.loader.js")
        .then(response => response.text())
        .then(scriptText => {
            const rawScriptBlob = new Blob([scriptText], { type: 'application/javascript' });
            const secureBlobUrl = URL.createObjectURL(rawScriptBlob);
            
            const engineBootstrapScript = document.createElement("script");
            engineBootstrapScript.src = secureBlobUrl;
            
            engineBootstrapScript.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    // Native instance compiling pipeline
                }).then((unityInstance) => {
                    window.unityInstance = unityInstance;
                    loadingCover.style.display = "none";
                    URL.revokeObjectURL(secureBlobUrl);
                }).catch((err) => {
                    console.error("Canvas Build Interrupted:", err);
                });
            };
            document.body.appendChild(engineBootstrapScript);
        })
        .catch(err => {
            console.error("Critical Asset Delivery Timeout:", err);
        });

    document.addEventListener("pointerdown", () => {
      container.focus();
      window.focus();
      canvas.focus();
    });
</script>
</body>
</html>
