<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tuff boiiiii</title>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        body {
            margin: 0; padding: 0; background: #000; color: white;
            font-family: sans-serif; text-align: center; overflow-x: hidden;
        }
        #particles-js { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; }
        .ui-container {
            position: relative; z-index: 1; padding: 50px;
            display: flex; justify-content: center; flex-wrap: wrap; gap: 20px;
        }
        .panel { background: #222; padding: 30px; border-radius: 12px; box-sizing: border-box; }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div class="ui-container">
        <div class="panel-header" style="width:100%; margin-bottom:20px;">
            <h2>Tepl!x Admin Panel</h2>
        </div>

        <div class="panel" style="width: 350px; text-align: center;">
            <p>System Authentication</p>
            <input type="password" id="admin-password" placeholder="Admin Secret Password" 
                   style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: none;">
            <button onclick="loadUserList()" 
                    style="width: 90%; padding: 12px; background: #a050ff; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">
                Load Registered Users
            </button>
        </div>

        <div class="panel" style="width: 400px; text-align: left; min-height: 300px;">
            <p style="font-weight: bold; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px;">Registered Users List</p>
            <div id="user-list-container">
                <p style="color: #666;">Enter admin password and click "Load Registered Users"</p>
            </div>
        </div>
    </div>

    <script>
        particlesJS("particles-js", { /* your particles config */ });

        const BACKEND_URL = 'https://imgui-backend-1.onrender.com';

        async function loadUserList() {
            const password = document.getElementById('admin-password').value.trim();
            const container = document.getElementById('user-list-container');

            if (!password) return alert("Please enter the admin password!");

            container.innerHTML = '<p style="color: #a050ff;">Connecting to server... (This can take 10-30 seconds on Render)</p>';

            try {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 45000); // 45s timeout

                const response = await fetch(`${BACKEND_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminPassword: password }),
                    signal: controller.signal
                });

                clearTimeout(timeout);

                if (response.status === 401) {
                    container.innerHTML = '<p style="color: red;">❌ Wrong Admin Password</p>';
                    return;
                }

                if (!response.ok) {
                    container.innerHTML = `<p style="color: red;">❌ Server Error: ${response.status}</p>`;
                    return;
                }

                const users = await response.json();
                container.innerHTML = '';

                if (users.length === 0) {
                    container.innerHTML = '<p style="color: #999;">No users registered yet.</p>';
                    return;
                }

                users.forEach(user => {
                    const row = document.createElement('div');
                    row.style.cssText = 'display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #333;';
                    
                    row.innerHTML = `
                        <span>${user.username}</span>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span style="font-size:11px; padding:3px 8px; border-radius:4px; background:${user.isBanned ? 'rgba(255,0,0,0.2)' : 'rgba(0,255,0,0.2)'}; color:${user.isBanned ? '#ff4d4d' : '#4dff4d'}">
                                ${user.isBanned ? "BANNED" : "ACTIVE"}
                            </span>
                            ${!user.isBanned ? `<button onclick="banTarget('${user.username}')" style="background:#331111; color:#ff4d4d; border:1px solid #ff4d4d; padding:4px 10px; border-radius:4px; cursor:pointer;">Ban</button>` : ''}
                        </div>
                    `;
                    container.appendChild(row);
                });
            } catch (err) {
                console.error(err);
                if (err.name === "AbortError") {
                    container.innerHTML = '<p style="color: red;">⏳ Request timed out. Try again.</p>';
                } else {
                    container.innerHTML = '<p style="color: red;">❌ Connection failed. Is the backend running?</p>';
                }
            }
        }

        async function banTarget(username) {
            if (!username) return alert("No username provided.");
            const password = document.getElementById('admin-password').value.trim();
            if (!password) return alert("Enter admin password first.");

            try {
                const response = await fetch(`${BACKEND_URL}/ban`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usernameToBan: username, adminPassword: password })
                });

                const data = await response.json();
                alert(data.message || "Action completed.");
                loadUserList(); // Refresh list
            } catch(e) {
                alert("Failed to ban user. Check connection.");
            }
        }
    </script>
</body>
</html>
