<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
</head>
<body style="background: #111; color: white; font-family: sans-serif; padding: 50px; text-align: center;">
    <h2>IMGUI Administration Panel</h2>
    <div style="background: #222; padding: 30px; border-radius: 12px; display: inline-block; width: 300px;">
        <p>Ban User Account</p>
        <input type="text" id="target-user" placeholder="Username to ban" style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: none;"><br>
        <input type="password" id="admin-password" placeholder="Admin Secret Password" style="width: 90%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: none;"><br>
        <button onclick="banTarget()" style="width: 97%; padding: 10px; background: red; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer;">Execute Ban</button>
    </div>
    <script>
        async function banTarget() {
            const target = document.getElementById('target-user').value;
            const password = document.getElementById('admin-password').value;
            
            const response = await fetch('https://imgui-backend.onrender.com/ban', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    usernameToBan: target,
                    adminPassword: password
                })
            });
            const data = await response.json();
            alert(data.message);
        }
    </script>
</body>
</html>
